<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ article.title }} | ImageTools</title>

    <meta name="description"
          content="{{ article.description }}">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, sans-serif;
            background: #f8fafc;
            color: #334155;
            line-height: 1.8;
        }

        header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 20px 0;
        }

        .container {
            width: min(1100px, calc(100% - 40px));
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: #4f46e5;
        }

        .back {
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }

        .article-header {
            text-align: center;
            max-width: 800px;
            margin: auto;
            padding: 80px 0 45px;
        }

        .category {
            color: #4f46e5;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(32px, 5vw, 52px);
            line-height: 1.2;
            color: #0f172a;
            margin: 0 0 20px;
        }

        .description {
            color: #64748b;
            font-size: 17px;
        }

        .date {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 15px;
        }

        .article-layout {
            display: grid;
            grid-template-columns: minmax(0, 760px);
            justify-content: center;
            padding-bottom: 90px;
        }

        .article {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 45px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, .05);
        }

        .article h1,
        .article h2,
        .article h3 {
            color: #0f172a;
        }

        .article h2 {
            margin-top: 40px;
            font-size: 28px;
        }

        .article h3 {
            margin-top: 30px;
            font-size: 21px;
        }

        .article p {
            margin: 16px 0;
        }

        .article ul,
        .article ol {
            padding-left: 25px;
        }

        .article a {
            color: #4f46e5;
            font-weight: 600;
        }

        .cta {
            margin-top: 45px;
            padding: 30px;
            border-radius: 18px;
            background: linear-gradient(135deg, #eef2ff, #ecfeff);
            text-align: center;
        }

        .cta h3 {
            margin-top: 0;
        }

        .cta a {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 22px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border-radius: 12px;
            text-decoration: none;
        }

        @media(max-width: 650px) {

            .container {
                width: min(100% - 28px, 1100px);
            }

            .article {
                padding: 25px;
                border-radius: 18px;
            }

            .article h2 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>

<header>

    <div class="container header">

        <div class="logo">
            ImageTools
        </div>

        <a href="/articles" class="back">
            ← All Articles
        </a>

    </div>

</header>


<section class="article-header">

    <div class="container">

        <div class="category">
            {{ article.category }}
        </div>

        <h1>
            {{ article.title }}
        </h1>

        <div class="description">
            {{ article.description }}
        </div>

        <div class="date">
            {{ article.date }}
        </div>

    </div>

</section>


<main class="article-layout">

    <article class="article">

        {{ content|safe }}


        <div class="cta">

            <h3>
                Ready to optimize your image?
            </h3>

            <p>
                Compress your image quickly with our free online tool.
            </p>

            <a href="/#tools">
                Compress Image
            </a>

        </div>

    </article>

</main>


</body>

</html>

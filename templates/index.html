<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ابزارهای آنلاین</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .tool {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>ابزارهای آنلاین من</h1>

    <div class="tool">
        <h2>تبدیل فرمت عکس</h2>
        <form action="/convert-image" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required>
            <select name="format">
                <option value="png">PNG</option>
                <option value="jpg">JPG</option>
                <option value="webp">WebP</option>
            </select>
            <button type="submit">تبدیل کن</button>
        </form>
    </div>

    <div class="tool">
        <h2>فشرده‌سازی عکس</h2>
        <form action="/compress-image" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required>
            <label>کیفیت (۱ تا ۱۰۰):</label>
            <input type="number" name="quality" value="70" min="10" max="100">
            <button type="submit">فشرده کن</button>
        </form>
    </div>

    <div class="tool">
        <h2>ادغام PDF</h2>
        <form action="/merge-pdf" method="post" enctype="multipart/form-data">
            <input type="file" name="files" accept=".pdf" multiple required>
            <button type="submit">ادغام کن</button>
        </form>
    </div>

    <div class="tool">
        <h2>فشرده‌سازی PDF</h2>
        <form action="/compress-pdf" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept=".pdf" required>
            <button type="submit">فشرده کن</button>
        </form>
    </div>

</body>
</html>
